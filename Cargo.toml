[package]
name = "ledger"
version = "0.1.0"
edition = "2024"

[dependencies]
ahash = "0.8.12"
bson = "3.1.0"
chrono = { version = "0.4.44", features = ["serde"] }
crossbeam = "0.8.4"
diesel = { version = "2.3.6", features = ["sqlite", "returning_clauses_for_sqlite_3_35"] }
diesel_migrations = "2.3.1"
hex = "0.4.3"
hmac = "0.12.1"
libsqlite3-sys = { version = "0.35.0", features = ["bundled"] }
prost = "0.14.3"
rand = "0.10.0"
reqwest = { version = "0.13.2", features = ["json"] }
rusty_paseto = "0.9.0"
serde = "1.0.228"
serde_json = "1.0.149"
macros = { path = "./macros" }
sha2 = "0.10.9"
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["full"] }
tonic = { version = "0.14.5", features = ["_tls-any"] }
tonic-prost = "0.14.5"
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
urlencoding = "2.1.3"

[build-dependencies]
tonic-prost-build = "0.14.5"
