syntax = "proto3";
package paper;

message Paper {
  string id                    = 1;
  string school                = 2;
  optional string event        = 3;
  int32 subject                = 4;
  int32 grade                  = 5;
  optional int32 stream        = 6;
  int32 type                   = 7;
  string teacher               = 8;
  string name                  = 9;
  int32 total_marks            = 10;
  int32 duration_minutes       = 11;
  int32 date                   = 12;
  int32 status                 = 13;
  optional string pdf_key      = 14;
  optional string ms_key       = 15;
  int32 generation_mode        = 16;
  optional string instructions = 17;
  int64 created                = 18;
  int64 updated                = 19;
}
