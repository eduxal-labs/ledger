// --- File Sync: Scheme & Answer Pages (4 actions: 91–94) ---

// Action 91: Replace/set scheme pages for a paper. Server deletes existing
// pages, creates new rows, returns presigned PUT URLs.
message UploadSchemePayload {
  string school = 1;
  string exam = 2;
  int32 subject = 3;
  optional int32 paper = 4; // NULL = single-paper subject
  int32 count = 5; // number of pages being uploaded (>= 1)
}

// Action 92: Remove all scheme pages for a paper.
message DeleteSchemePayload {
  string school = 1;
  string exam = 2;
  int32 subject = 3;
  optional int32 paper = 4;
}

// Action 93: Replace/set answer sheet pages for a student's paper.
// Server deletes existing pages, creates new rows, returns presigned PUT URLs.
