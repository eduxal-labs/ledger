syntax = "proto3";
package question_bank;

service QuestionBank {
  // ── Global catalog (admin/teacher) ──────────────────────────
  rpc CreateQuestion(CreateQuestionRequest)       returns (CreateQuestionResponse);
  rpc GetQuestion(GetQuestionRequest)             returns (GetQuestionResponse);
  rpc ListQuestions(ListQuestionsRequest)         returns (ListQuestionsResponse);
  rpc UpdateQuestion(UpdateQuestionRequest)       returns (UpdateQuestionResponse);
  rpc DeleteQuestion(DeleteQuestionRequest)       returns (DeleteQuestionResponse);
  rpc BulkImport(BulkImportRequest)               returns (BulkImportResponse);
  rpc RequestImageUploadUrls(ImageUploadUrlsRequest) returns (ImageUploadUrlsResponse);

  // ── Paper question management ────────────────────────────────
  rpc GeneratePaper(GeneratePaperRequest)         returns (GeneratePaperResponse);
  rpc GetPaperQuestions(GetPaperQuestionsRequest) returns (GetPaperQuestionsResponse);
  rpc RegenerateQuestion(RegenerateQuestionRequest) returns (RegenerateQuestionResponse);
  rpc ClearPaperQuestions(ClearPaperQuestionsRequest) returns (ClearPaperQuestionsResponse);
  rpc FinalizePaper(FinalizePaperRequest)         returns (FinalizePaperResponse);
  rpc EditPaperQuestion(EditPaperQuestionRequest) returns (EditPaperQuestionResponse);

  // ── Marking ──────────────────────────────────────────────────
  rpc GetMarkingStatus(MarkingStatusRequest)      returns (MarkingStatusResponse);
  rpc GetQuestionGrades(GetQuestionGradesRequest) returns (GetQuestionGradesResponse);
}

// ── Question messages ────────────────────────────────────────────────────────

message Question {
  int32 id                           = 1;
  int32 topic_id                     = 2;
  string body                        = 3;
  int32 body_format                  = 4;
  optional string stimulus           = 5;
  int32 type                         = 6;
  int32 difficulty                   = 7;
  int32 cognitive_level              = 8;
  int32 marks                        = 9;
  optional int32 max_marks           = 10;
  int32 answer_space_type            = 11;
  optional int32 answer_lines        = 12;
  optional int32 answer_box_height_mm = 13;
  optional string example_answer     = 14;
  repeated RubricCriterion rubric    = 15;
  repeated QuestionPart parts        = 16;
  int64 created                      = 17;
  int64 updated                      = 18;
}

message RubricCriterion {
  int32 position           = 1;
  string criterion         = 2;
  int32 marks              = 3;
  optional int32 max_marks = 4;
  bool required            = 5;
}

message QuestionPart {
  int32 position                       = 1;
  string label                         = 2;
  string body                          = 3;
  int32 body_format                    = 4;
  int32 marks                          = 5;
  optional int32 max_marks             = 6;
  int32 answer_space_type              = 7;
  optional int32 answer_lines          = 8;
  optional int32 answer_box_height_mm  = 9;
  optional string example_answer       = 10;
  optional string stimulus             = 11;
  repeated RubricCriterion rubric      = 12;
}

// ── Create ───────────────────────────────────────────────────────────────────

message RubricCriterionInput {
  string criterion         = 1;
  int32 marks              = 2;
  optional int32 max_marks = 3;
  bool required            = 4;
}

message QuestionPartInput {
  string label                         = 1;
  string body                          = 2;
  int32 body_format                    = 3;
  int32 marks                          = 4;
  optional int32 max_marks             = 5;
  int32 answer_space_type              = 6;
  optional int32 answer_lines          = 7;
  optional int32 answer_box_height_mm  = 8;
  optional string example_answer       = 9;
  optional string stimulus             = 10;
  repeated RubricCriterionInput rubric = 11;
}

message CreateQuestionRequest {
  int32 topic_id                       = 1;
  string body                          = 2;
  int32 body_format                    = 3;
  optional string stimulus             = 4;
  int32 type                           = 5;
  int32 difficulty                     = 6;
  int32 cognitive_level                = 7;
  int32 marks                          = 8;
  optional int32 max_marks             = 9;
  int32 answer_space_type              = 10;
  optional int32 answer_lines          = 11;
  optional int32 answer_box_height_mm  = 12;
  optional string example_answer       = 13;
  repeated RubricCriterionInput rubric = 14;
  repeated QuestionPartInput parts     = 15;
}

message CreateQuestionResponse { Question question = 1; }

// ── Read ─────────────────────────────────────────────────────────────────────

message GetQuestionRequest  { int32 question_id = 1; }
message GetQuestionResponse { Question question = 1; }

message ListQuestionsRequest {
  int32 topic_id    = 1;
  int32 page        = 2;
  int32 page_size   = 3;
}
message ListQuestionsResponse {
  repeated Question questions = 1;
  int32 total                 = 2;
}

// ── Update ───────────────────────────────────────────────────────────────────

message UpdateQuestionRequest {
  int32 question_id                      = 1;
  optional int32 topic_id                = 2;
  optional string body                   = 3;
  optional int32 body_format             = 4;
  optional string stimulus               = 5;
  optional int32 type                    = 6;
  optional int32 difficulty              = 7;
  optional int32 cognitive_level         = 8;
  optional int32 marks                   = 9;
  optional int32 max_marks               = 10;
  optional int32 answer_space_type       = 11;
  optional int32 answer_lines            = 12;
  optional int32 answer_box_height_mm    = 13;
  optional string example_answer         = 14;
  repeated RubricCriterionInput rubric   = 15;
  repeated QuestionPartInput parts       = 16;
}
message UpdateQuestionResponse { Question question = 1; }

// ── Delete ───────────────────────────────────────────────────────────────────

message DeleteQuestionRequest  { int32 question_id = 1; }
message DeleteQuestionResponse {}

// ── Bulk import ──────────────────────────────────────────────────────────────

message BulkImportRequest {
  // Natural key for topic resolution — the server resolves the correct
  // topic_id from these fields instead of trusting per-question topic_id
  // values, which are client-local auto-increment IDs that don't match
  // server-side IDs.
  string subject_name = 2;
  int32 curriculum = 3;
  int32 grade = 4;
  string topic_name = 5;
  repeated CreateQuestionRequest questions = 1;
}
message BulkImportResponse {
  int32 created = 1;
  int32 skipped = 2;
  repeated string errors = 3;
}

// ── Image upload ─────────────────────────────────────────────────────────────

message ImageUploadUrlsRequest {
  int32 question_id = 1;
  int32 count       = 2;
}
message ImageUploadUrlsResponse { repeated string urls = 1; }

// ── Paper question management ─────────────────────────────────────────────────

message TopicAllocation {
  int32 topic_id    = 1;
  int32 total_marks = 2;
}

message GeneratePaperRequest {
  string paper_id                            = 1;
  int32 total_marks                          = 2;
  repeated TopicAllocation topic_allocations = 3;
}
message GeneratePaperResponse { bool success = 1; string message = 2; }

message GetPaperQuestionsRequest {
  string paper_id          = 1;
  optional int32 student   = 2;
}
message GetPaperQuestionsResponse {
  repeated Question questions = 1;
}

message RegenerateQuestionRequest {
  string paper_id            = 1;
  optional int32 student     = 2;
  int32 position             = 3;
  int32 topic_id             = 4;
  int32 marks                = 5;
  repeated int32 exclude_ids = 6;
}
message RegenerateQuestionResponse { Question question = 1; }

message ClearPaperQuestionsRequest {
  string paper_id         = 1;
  optional int32 student  = 2;
}
message ClearPaperQuestionsResponse {}

message FinalizePaperRequest  { string paper_id = 1; }
message FinalizePaperResponse { string pdf_key = 1; string ms_key = 2; }

// ── Marking ───────────────────────────────────────────────────────────────────

message MarkingStatusRequest  { string paper_id = 1; }
message MarkingStatusResponse {
  int32 phase           = 1;
  string progress       = 2;
  optional string error = 3;
  int32 total_students  = 4;
  int32 marked_students = 5;
}

message QuestionGrade {
  int32 question_id        = 1;
  float score              = 2;
  optional string feedback = 3;
}

message GetQuestionGradesRequest {
  string paper_id = 1;
  int32 student   = 2;
}
message GetQuestionGradesResponse { repeated QuestionGrade grades = 1; }

// ── Edit Paper Question ──────────────────────────────────────────────────────

message EditPaperQuestionRequest {
  string paper_id = 1;
  int32 question_id = 2;
  string body = 3;
  int32 marks = 4;
  repeated RubricCriterionInput rubric = 5;
  repeated QuestionPartInput parts = 6;
}

message EditPaperQuestionResponse {
  Question question = 1;
}
